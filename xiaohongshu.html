<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>小红书爆款标题制造机 · 奶油风</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #fdfbf7 0%, #f4e9d8 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 40px;
            padding: 40px 30px;
            box-shadow: 0 30px 40px rgba(0, 0, 0, 0.05);
        }
        h1 {
            color: #5c4e3d;
            font-size: 28px;
            font-weight: 500;
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }
        .subtitle {
            color: #a18b7a;
            text-align: center;
            font-size: 14px;
            margin-bottom: 30px;
            font-weight: 400;
        }
        .input-wrapper {
            background: rgba(255, 255, 255, 0.7);
            border-radius: 60px;
            padding: 4px;
            border: 1px solid rgba(196, 154, 122, 0.2);
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
        }
        input {
            width: 100%;
            padding: 16px 24px;
            background: transparent;
            border: none;
            outline: none;
            color: #3e3326;
            font-size: 16px;
        }
        input::placeholder {
            color: #c4b5a5;
            font-weight: 300;
        }
        .generate-btn {
            width: 100%;
            padding: 16px;
            background: #c49a7a;
            border: none;
            border-radius: 60px;
            color: #fff;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 18px rgba(196, 154, 122, 0.2);
            margin-bottom: 30px;
            letter-spacing: 1px;
        }
        .generate-btn:hover {
            background: #b08765;
            transform: scale(1.01);
            box-shadow: 0 12px 24px rgba(196, 154, 122, 0.3);
        }
        .titles-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .title-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #4a3f33;
            font-size: 15px;
            transition: 0.2s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.02);
        }
        .title-card:hover {
            background: rgba(255, 255, 255, 0.9);
            border-color: #c49a7a;
        }
        .copy-btn {
            background: rgba(196, 154, 122, 0.15);
            border: 1px solid rgba(196, 154, 122, 0.3);
            color: #8b6f58;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 400;
        }
        .copy-btn:hover {
            background: #c49a7a;
            color: #fff;
            border-color: #c49a7a;
        }
        .loading, .error {
            color: #8b7a6b;
            text-align: center;
            padding: 40px;
            font-size: 16px;
            font-weight: 300;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            color: #c4b5a5;
            font-size: 12px;
            font-weight: 300;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍃 标题制造机</h1>
        <div class="subtitle">小红书爆款灵感 · 温柔奶油系</div>
        
        <div class="input-wrapper">
            <input type="text" id="keywordInput" placeholder="输入关键词，例如：防晒霜、瑜伽裤..." value="防晒霜">
        </div>
        
        <button class="generate-btn" onclick="generateTitles()">✨ 召唤灵感</button>
        
        <div id="titlesContainer" class="titles-container">
            <div class="title-card">
                <span>✨ 输入关键词，召唤爆款标题～</span>
                <button class="copy-btn" onclick="copyToClipboard('输入关键词，召唤爆款标题～')">复制</button>
            </div>
        </div>
        
        <div class="footer">基于 DeepSeek 深度灵感 · 一键复制拿去用</div>
    </div>

    <script>
        function generateTitles() {
            const keyword = document.getElementById('keywordInput').value;
            const container = document.getElementById('titlesContainer');
            
            if (!keyword || keyword.trim() === '') {
                container.innerHTML = '<div class="error">🍂 先输入一个关键词吧～</div>';
                return;
            }

            container.innerHTML = '<div class="loading">🍃 正在脑暴中，灵感迸发...</div>';

            setTimeout(() => {
                const templates = [
                    `救命🆘！这个${keyword}真的把我拿捏了！`,
                    `我不允许还有人不知道这个${keyword}！`,
                    `大数据请把我推给需要${keyword}的姐妹！`,
                    `求求了🥺，这个${keyword}谁用谁好看！`,
                    `震惊🤯！用了这个${keyword}我直接被问爆！`,
                    `我不说你能看出来我用了${keyword}吗？`,
                    `纯分享😭！这个${keyword}简直是来报恩的！`,
                    `被问了800遍的${keyword}链接来了！`,
                    `普通人用${keyword}的真实反馈！`,
                    `都给我去买这个${keyword}！！真的绝了！`,
                    `这个${keyword}让我在小红书被赞爆了🔥`,
                    `后悔没早买系列➕1：${keyword}！`
                ];

                const shuffled = templates.sort(() => 0.5 - Math.random());
                const selected = shuffled.slice(0, 5);
                const titles = selected.map(t => t.replace(/{keyword}/g, keyword));

                container.innerHTML = titles.map(title => `
                    <div class="title-card">
                        <span>${title}</span>
                        <button class="copy-btn" onclick="copyToClipboard('${title.replace(/'/g, "\\'")}')">复制</button>
                    </div>
                `).join('');
            }, 600);
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('📋 标题已复制！快去发小红书吧 💪');
            }).catch(() => {
                alert('❌ 复制失败，手动复制一下吧～');
            });
        }
    </script>
</body>
</html>

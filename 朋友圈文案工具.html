<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>朋友圈文案生成器 | ins奶油风</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #da3838 0%, #d89a3e 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 2rem 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 主容器 — 奶油柔光 */
        .generator-container {
            max-width: 680px;
            width: 100%;
            margin: 0 auto;
            background: rgba(226, 222, 230, 0.55);
            backdrop-filter: blur(2px);
            border-radius: 48px;
            padding: 2rem 1.8rem 2.5rem;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.08), 0 2px 6px rgba(0, 0, 0, 0.02);
            transition: all 0.2s ease;
        }

        /* 标题区 */
        .title-section {
            text-align: center;
            margin-bottom: 2rem;
        }
        .title-section h1 {
            font-size: 2rem;
            font-weight: 580;
            letter-spacing: -0.3px;
            color: #5a3e2b;
            background: rgba(255, 248, 235, 0.7);
            display: inline-block;
            padding: 0 0.8rem;
            border-radius: 60px;
            backdrop-filter: blur(2px);
            font-family: inherit;
        }
        .title-section p {
            color: #a58362;
            margin-top: 10px;
            font-size: 0.85rem;
            font-weight: 400;
        }

        /* 输入区 */
        .input-group {
            margin-bottom: 1.6rem;
        }
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: #7f6043;
            letter-spacing: 0.3px;
            margin-bottom: 8px;
            margin-left: 6px;
        }
        .keyword-input {
            width: 100%;
            padding: 14px 18px;
            font-size: 1rem;
            background: #ffffffdd;
            border: 1px solid #eedbc9;
            border-radius: 40px;
            outline: none;
            transition: all 0.2s;
            font-family: inherit;
            color: #3f2c1c;
            backdrop-filter: blur(2px);
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }
        .keyword-input:focus {
            border-color: #c49a7a;
            background: #fffffffa;
            box-shadow: 0 0 0 3px rgba(196, 154, 122, 0.15);
        }

        /* 下拉菜单 */
        .style-select {
            width: 100%;
            padding: 14px 18px;
            font-size: 1rem;
            background: #ffffffdd;
            border: 1px solid #eedbc9;
            border-radius: 40px;
            outline: none;
            cursor: pointer;
            font-family: inherit;
            color: #3f2c1c;
            appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="%23c49a7a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>');
            background-repeat: no-repeat;
            background-position: right 18px center;
        }
        .style-select:focus {
            border-color: #c49a7a;
            box-shadow: 0 0 0 3px rgba(196, 154, 122, 0.15);
        }

        /* 奶咖色按钮 */
        .generate-btn {
            background: #c49a7a;
            border: none;
            width: 100%;
            padding: 14px 0;
            font-size: 1.05rem;
            font-weight: 600;
            color: white;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            margin-top: 8px;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 8px rgba(196, 154, 122, 0.2);
        }
        .generate-btn:hover {
            background: #b28564;
            transform: scale(0.98);
            box-shadow: 0 2px 6px rgba(196, 154, 122, 0.25);
        }
        .generate-btn:active {
            transform: scale(0.96);
        }

        /* 文案展示区网格 */
        .cards-grid {
            margin-top: 2.2rem;
            display: flex;
            flex-direction: column;
            gap: 1.4rem;
        }

        /* 毛玻璃卡片 */
        .glass-card {
            background: rgba(255, 251, 245, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 1.3rem 1.5rem 1rem 1.5rem;
            box-shadow: 0 10px 20px -8px rgba(0, 0, 0, 0.05), 0 1px 2px rgba(0, 0, 0, 0.02);
            border: 1px solid rgba(255, 245, 235, 0.8);
            transition: all 0.2s;
        }
        .card-content {
            font-size: 0.98rem;
            line-height: 1.48;
            color: #3a2a1e;
            font-weight: 450;
            white-space: pre-wrap;
            word-break: break-word;
            padding-right: 8px;
            min-height: 70px;
        }
        .card-footer {
            display: flex;
            justify-content: flex-end;
            margin-top: 1rem;
        }
        .copy-btn {
            background: rgba(196, 154, 122, 0.15);
            border: none;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 500;
            color: #c49a7a;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(4px);
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .copy-btn:hover {
            background: #c49a7a;
            color: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
        .copy-btn:active {
            transform: scale(0.94);
        }
        /* 提示小toast */
        .toast-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            background: #2f2a24cc;
            backdrop-filter: blur(12px);
            color: #fef2e6;
            padding: 8px 20px;
            border-radius: 60px;
            font-size: 0.8rem;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
            pointer-events: none;
            z-index: 999;
            white-space: nowrap;
            font-family: monospace;
        }
        .toast-msg.show {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        /* 空状态微提示 */
        .placeholder-tip {
            text-align: center;
            padding: 2rem 1rem;
            color: #bbaa95;
            font-size: 0.85rem;
            background: rgba(245, 235, 220, 0.4);
            border-radius: 40px;
            backdrop-filter: blur(4px);
        }

        hr {
            margin: 10px 0;
            border: 0;
            height: 1px;
            background: #eedbc9;
        }

        @media (max-width: 550px) {
            body {
                padding: 1.2rem;
            }
            .generator-container {
                padding: 1.5rem 1.2rem;
            }
            .glass-card {
                padding: 1rem 1.2rem;
            }
            .card-content {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
<div class="generator-container">
    <div class="title-section">
        <h1>📖 朋友圈文案器</h1>
        <p>ins极简奶油 · 灵感发酵站</p>
    </div>

    <div class="input-group">
        <label>✨ 心情关键词 (例如: 加班, 旅行, 吃火锅)</label>
        <input type="text" id="keywordInput" class="keyword-input" placeholder="比如: 熬夜赶稿、周末露营、一杯奶茶..." autocomplete="off">
    </div>

    <div class="input-group">
        <label>🎨 选择风格</label>
        <select id="styleSelect" class="style-select">
            <option value="humor">😎 幽默自嘲</option>
            <option value="fresh">🌸 文艺清新</option>
            <option value="fanshao">👑 凡尔赛</option>
            <option value="worker">💼 打工人嘴替</option>
        </select>
    </div>

    <button id="generateBtn" class="generate-btn">✨ 生成文案 · 三连击 ✨</button>

    <div id="cardsContainer" class="cards-grid">
        <div class="placeholder-tip">💭 输入关键词，选择风格，<br> 点击生成属于你的朋友圈灵感～</div>
    </div>
</div>
<div id="toastMsg" class="toast-msg">📋 已复制到剪贴板</div>

<script>
    (function() {
        // ---------- 预设模板库（按风格分类，支持动态组合关键词）----------
        // 为了使文案更生动，每个风格下准备若干句式骨架 + 修饰库
        // 根据心情关键词可以随机嵌入到特定占位符 {kw} 中。
        
        // 幽默自嘲风格模板
        const humorTemplates = [
            "别人 {kw} 是享受，我 {kw} 是渡劫。生活你好，生活再见👋",
            "今日份成就：{kw} 消耗了我99%的元神，剩下1%用来发这条朋友圈。",
            "本来想当个优雅博主，结果 {kw} 让我原形毕露… 但照片还是要发的📸",
            "关于 {kw} 这件事，我的态度就两个字：下次还敢（不是）。",
            "我的 {kw} 后遗症：手机内存不够，但表情包多了300张。",
            "当代年轻人现状：一边 {kw} ，一边默念‘我很好，我可以’。",
            "别人 {kw} 是故事，我 {kw} 是事故现场，需要奶茶安慰🥤",
            "当 {kw} 遇上我的拖延症，等于一个奇迹的诞生。",
            "每次 {kw} 完，都觉得自己能拿奥斯卡，可惜没有观众。",
            "我的 {kw} 日常：三分靠努力，七分靠运气，剩下九十分靠发朋友圈记录。"
        ];
        
        // 文艺清新风格模板
        const freshTemplates = [
            "在 {kw} 的间隙里，收集了一袋子温柔，风也替我存档。🍃",
            "把 {kw} 写进日记本，日子便有了细碎的光。☁️",
            "今日份浪漫：{kw} 和黄昏，刚好撞个满怀。",
            "生活需要一点轻盈的 {kw} ，像蒲公英的旅行，不知归处却美好。",
            "{kw} 时，我听见世界按下静音键，只剩下心跳和风声。",
            "用一抹奶油色调，记录 {kw} 的小确幸。日子渺小重复，却都是恩赐。",
            "{kw} 带来的满足感，像是咬下第一口脆桃，夏天藏进嘴角。",
            "想在 {kw} 里加一点糖，兑上今晚的月色，微醺。",
            "生活的诗意，不在远方，在 {kw} 时不经意的回眸里。",
            "今日宜 {kw} ，忌焦虑。把温柔碾碎，放入生活的缝隙中。"
        ];
        
        // 凡尔赛风格模板 (表面抱怨实则炫耀)
        const fanshaoTemplates = [
            "哎，最近 {kw} 真的太累了，朋友都劝我别太拼，可没办法，优秀的人总是更忙吧。🙃",
            "{kw} 完又被好几个同事请教经验，真的不想当C位了，能不能让我安静地做个普通人？",
            "一不小心的 {kw} 又被老板夸了，还硬要给我加奖金，真的很烦，又要考虑怎么花了。",
            "真搞不懂，我只是正常 {kw} 而已，怎么朋友圈都在问我是不是偷偷努力了？天赋而已啦。",
            "{kw} 的时候随手拍了一张，结果一堆人说构图绝了。日常随手罢了，没有特意学过摄影～",
            "男朋友又因为我 {kw} 太专注吃醋了，说我只顾着提升自己都不理他。啊这，优秀也是错吗？",
            "刚刚 {kw} 被路人偷拍放到了校园论坛，说想认识我…… 长得好看真是太困扰了。",
            "好无语，{kw} 完家里收到三个快递，都是闺蜜寄来的礼物，说最近我太辛苦了。其实还好啦～",
            "{kw} 时随手发了张自拍，竟然有人评论我像明星，拜托，我真的只是素颜随便拍拍。",
            "不想凡尔赛，但 {kw} 对我来说好像真的没难度，身边人总说羡慕，其实你们也可以呀。"
        ];
        
        // 打工人嘴替风格 (扎心真实, 共鸣)
        const workerTemplates = [
            "我以为 {kw} 能治愈我，结果更累了。明天还要继续搬砖，谁偷走了我的睡眠。💔",
            "周报写了: {kw} 占比80%，剩下的时间在想如何委婉地骂甲方。真实。",
            "{kw} 是工作的一部分，而工作的全部是: 怎么还没到周五？？？",
            "这个月的咖啡因额度全献给 {kw} 了，领导画的饼比早餐摊还大。",
            "打工人的 {kw} 后：颈椎病+视力下降，但工资纹丝不动，笑死。",
            "嘴上说着 {kw} 好难，身体却很诚实地继续加班。这就是打工人的宿命吧。",
            "如果 {kw} 有段位，我一定是最强王者，毕竟每天都在渡劫。",
            "同事问我为什么 {kw} 还能笑出来？因为不笑就要哭了呀。🙂",
            "今日 {kw} 感想: 老板以为我爱工作，实际上我只爱发工资那一天。",
            "{kw} 时的我：精神离职状态。身体: 行尸走肉版奋斗。"
        ];
        
        // 风格映射
        const styleMap = {
            humor: humorTemplates,
            fresh: freshTemplates,
            fanshao: fanshaoTemplates,
            worker: workerTemplates
        };
        
        // 辅助随机整数
        function randomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }
        
        // 从数组随机取一项
        function randomItem(arr) {
            return arr[randomInt(0, arr.length - 1)];
        }
        
        // 关键词修饰增强：如果关键词太短或为空，用占位符替换
        function sanitizeKeyword(raw) {
            let kw = raw.trim();
            if (kw === "") return "今天的小生活";
            // 适当加一点语气 但保留原始关键词，也可以太长截断，但没必要
            if (kw.length > 18) kw = kw.slice(0, 16) + "…";
            return kw;
        }
        
        // 核心：根据关键词+风格 生成一条文案 (使用模板替换 {kw})
        function generateOneSentence(keyword, styleType) {
            const templatesArray = styleMap[styleType];
            if (!templatesArray || templatesArray.length === 0) {
                return `${keyword} · 今日份美好待续～ 🌟`; // 兜底
            }
            let baseTemplate = randomItem(templatesArray);
            // 替换 {kw} 占位符为关键词
            let result = baseTemplate.replace(/{kw}/g, keyword);
            // 附加随机点缀 (让同风格文案更有随机感但不过分)
            // 对于清新风格加一点emoji或者符号（随意增加一点俏皮感，不破坏结构）
            if (styleType === 'fresh' && Math.random() > 0.6) {
                let suffixes = [' ✨', ' 🌿', ' 🧸', ' 🕊️'];
                result += randomItem(suffixes);
            }
            if (styleType === 'humor' && Math.random() > 0.7) {
                let suffixes = [' 🤡', ' 🫠', ' 🥲'];
                result += randomItem(suffixes);
            }
            if (styleType === 'worker' && Math.random() > 0.65) {
                let suffixes = [' 💻', ' ☕️', ' 🥱'];
                result += randomItem(suffixes);
            }
            if (styleType === 'fanshao' && Math.random() > 0.7) {
                let suffixes = [' 💅', ' 👑', ' ✨'];
                result += randomItem(suffixes);
            }
            return result;
        }
        
        // 生成3条完全不同的文案 (基于相同风格&关键词，但不同模板组合)
        function generateThreeCopy(keyword, styleType) {
            const kw = sanitizeKeyword(keyword);
            // 为了避免三句完全相同 (极低概率使用同一模板，采用不同的随机组合)
            // 并且保证三条内容不同: 使用去重逻辑，但模板库足够大，一般不会重复
            let results = [];
            let attempts = 0;
            while (results.length < 3 && attempts < 20) {
                let newText = generateOneSentence(kw, styleType);
                // 避免完全相同短句重复, 只去重
                if (!results.includes(newText)) {
                    results.push(newText);
                }
                attempts++;
            }
            // 如果不足3条, 补一些自定义生成
            while (results.length < 3) {
                results.push(`${kw} · 平凡日子里泛着光，属于我的小故事。${styleType === 'humor' ? '🎈' : '🌼'}`);
            }
            return results;
        }
        
        // 渲染卡片区域
        function renderCards(cardTexts) {
            const container = document.getElementById('cardsContainer');
            if (!cardTexts || cardTexts.length === 0) {
                container.innerHTML = `<div class="placeholder-tip">✨ 输入关键词，生成你的灵感文案 ✨</div>`;
                return;
            }
            // 生成三个毛玻璃卡片
            let html = '';
            for (let i = 0; i < cardTexts.length; i++) {
                const text = cardTexts[i];
                // 添加转义但保留文案可读性
                const safeText = text.replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
                html += `
                    <div class="glass-card" data-card-index="${i}">
                        <div class="card-content">${safeText}</div>
                        <div class="card-footer">
                            <button class="copy-btn" data-copy-text="${escapeForAttr(text)}">📋 复制文案</button>
                        </div>
                    </div>
                `;
            }
            container.innerHTML = html;
            
            // 绑定所有复制按钮事件
            const copyBtns = document.querySelectorAll('.copy-btn');
            copyBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    let copyContent = btn.getAttribute('data-copy-text');
                    if (copyContent) {
                        // 解码可能存在的html实体反转义
                        copyContent = unescapeAttr(copyContent);
                        copyToClipboard(copyContent);
                    } else {
                        // 备用
                        const cardDiv = btn.closest('.glass-card');
                        const contentDiv = cardDiv?.querySelector('.card-content');
                        if (contentDiv) {
                            let raw = contentDiv.innerText || contentDiv.textContent;
                            copyToClipboard(raw);
                        }
                    }
                });
            });
        }
        
        // 辅助: 转义存储属性
        function escapeForAttr(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;')
                       .replace(/</g, '&lt;')
                       .replace(/>/g, '&gt;')
                       .replace(/"/g, '&quot;')
                       .replace(/'/g, '&#39;');
        }
        function unescapeAttr(str) {
            if (!str) return '';
            return str.replace(/&lt;/g, '<')
                       .replace(/&gt;/g, '>')
                       .replace(/&quot;/g, '"')
                       .replace(/&#39;/g, "'")
                       .replace(/&amp;/g, '&');
        }
        
        // 复制功能 + toast
        let toastTimeout = null;
        function copyToClipboard(text) {
            if (!text) return;
            // 尝试现代剪贴板API
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast('📋 文案已复制！');
                }).catch(() => {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }
        
        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            showToast('📋 复制成功 (兼容模式)');
        }
        
        function showToast(msg) {
            const toast = document.getElementById('toastMsg');
            if (!toast) return;
            toast.textContent = msg || '📋 已复制到剪贴板';
            toast.classList.add('show');
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 1800);
        }
        
        // 主要生成逻辑
        function handleGenerate() {
            const keywordInput = document.getElementById('keywordInput');
            let keyword = keywordInput.value;
            if (!keyword || keyword.trim() === "") {
                // 友好的默认关键词
                keyword = "平凡小日子";
                keywordInput.value = keyword;
                // 可选轻微提醒，但不强制
                showToast("💡 关键词已自动填充～ 试试修改吧");
            }
            const styleSelect = document.getElementById('styleSelect');
            const selectedStyle = styleSelect.value;
            
            // 生成三条文案
            const threeTexts = generateThreeCopy(keyword, selectedStyle);
            renderCards(threeTexts);
        }
        
        // 绑定生成按钮事件 + 初始示例展示一个温和引导 (不强制文案)
        const genBtn = document.getElementById('generateBtn');
        genBtn.addEventListener('click', handleGenerate);
        
        // 可选: 初次加载页面时，给一个默认示例展示但不清爽? 可以给一个默认demo体验(空状态保留占位，但用户一点击就出)
        // 为了让界面不空旷, 初始时展示一组轻提示文案（占位卡片但非生成）
        // 但符合需求：不生成强制内容，用户点击后再生成。为了展示毛玻璃样式，初始无文案卡片，只显示占位符，用户点击后即生成。
        // 更好体现“点击按钮生成3条文案”，同时展示完整复制功能
        // 再加一条: 如果用户想快速体验，也可点击。完全符合要求。
        // 附加细节：输入框按回车也可以触发生成
        const keywordField = document.getElementById('keywordInput');
        keywordField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleGenerate();
            }
        });
        
        // 为了趣味，初始加载时如果有需求可展示一个默认？但不会干扰，保留空占位。
        // 不过为了更加精致，可以在DOMContentLoaded后设置一个默认极简占位已经存在
        // 完毕
    })();
</script>
</body>
</html>
